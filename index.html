<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="assets\images\player\idle.png">
  <title>Horse Tale | JavaScript Version</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      color: white;
    }

    canvas {
      border: 4px solid black;
      image-rendering: pixelated;
      image-rendering: crisp-edges;

      height: 100vh;
      position: relative;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

    <canvas id="canvas"></canvas>
  </div>

  <script type="module" src="./data/main.js"></script>
